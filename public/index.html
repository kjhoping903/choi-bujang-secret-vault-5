<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BYTE BACK | 자료실 로그인</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; background: #101a28; color: #ecf4ff; }
    main { max-width: 760px; margin: 0 auto; padding: 44px 22px 64px; }
    .eyebrow { color: #8ad8df; font-size: 14px; font-weight: 700; letter-spacing: .08em; }
    h1 { margin: 16px 0; font-size: clamp(30px, 7vw, 48px); line-height: 1.2; }
    p { font-size: 17px; line-height: 1.7; color: #bfd0e5; }
    .notice { margin: 26px 0; padding: 18px; border: 1px solid #d07384; border-radius: 14px; color: #ffe3e8; background: #612a3544; }
    ul { list-style: none; display: grid; gap: 12px; padding: 0; }
    li { border: 1px solid #51667c; border-radius: 14px; padding: 17px 19px; background: #1a2a3d; }
    strong { display: block; font-size: 18px; margin-bottom: 5px; }
    li span { color: #bfd0e5; }
    .version-badge { display: inline-block; margin-top: 28px; padding: 7px 11px; border: 1px solid #51667c; border-radius: 8px; color: #bfd0e5; font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">BYTE BACK · 3단계 로그인 자료실</div>
    <h1>자료실</h1>
    <p>가상 메모를 공개 정적 파일에서 제거했습니다.</p>
    <div class="notice">로그인 후 서버를 통해 학습용 DB의 메모를 조회합니다. 자료가 없거나 연결되지 않았다면 상태 메시지를 확인하세요.</div>
    <section aria-label="서버 상태 확인">
      <button id="health-check" type="button" aria-describedby="health-status">서버 상태 확인</button>
      <p id="health-status" role="status" aria-live="polite">버튼을 누르면 서버 응답 상태를 확인합니다.</p>
    </section>
    <p id="session-status" role="status" aria-live="polite">로그인 상태를 확인하는 중입니다.</p>
    <form id="login-form">
      <p><label>이메일 <input id="email" type="email" autocomplete="username" required></label></p>
      <p><label>비밀번호 <input id="password" type="password" autocomplete="current-password" required></label></p>
      <button id="login" type="submit" disabled>로그인</button>
      <button id="signup" type="submit" disabled>회원가입</button>
      <p>처음 방문했다면 이메일과 비밀번호를 입력하고 회원가입을 누르세요. 인증 메일이 오면 인증을 마친 뒤 로그인하세요.</p>
    </form>
    <button id="logout" type="button" hidden>로그아웃</button>
    <p id="auth-status" role="status">로그인 설정을 확인하는 중입니다.</p>
    <form id="note-form" hidden>
      <p><label>메모 제목 <input id="note-title" maxlength="200" required></label></p>
      <p><label>메모 내용 <textarea id="note-body" maxlength="10000" required></textarea></label></p>
      <button type="submit">메모 추가</button>
    </form>
    <ul id="cards" aria-live="polite" hidden></ul>
    <footer><small id="version-badge" class="version-badge" role="status" aria-live="polite">버전 정보를 불러오는 중입니다.</small></footer>
  </main>
  <script type="module" src="/login.js"></script>
  <script type="module" src="/health-status.js"></script>
  <script type="module" src="/version-badge.js"></script>
</body>
</html>
